[project]
name = "tokencost"
version = "0.1.0"
description = "Estimate and compare token costs across AI providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rich>=13",
    "tiktoken>=0.9",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
tokencost = "tokencost.cli.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokencost"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
