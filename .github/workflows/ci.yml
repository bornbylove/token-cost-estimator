name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Cache tokenizer vocabulary
        uses: actions/cache@v4
        with:
          path: .tiktoken-cache
          key: tiktoken-o200k_base

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test
